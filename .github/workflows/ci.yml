# Checks on every pull request and every push to main: the web app type-checks and builds, and the jobs' tests pass.
# No secrets and no deploys: deploys stay manual (scripts/deploy-web.sh, scripts/deploy-jobs.sh).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (types, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: node node_modules/vite/bin/vite.js build
        env:
          NODE_OPTIONS: --max-old-space-size=2048

  jobs:
    name: jobs (tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jobs
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: jobs/uv.lock
      - run: uv sync --locked
      - run: uv run --locked pytest -q
        env:
          PYTHONPATH: src
