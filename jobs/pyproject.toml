[project]
name = "lhzn-blue-jobs"
version = "0.1.0"
description = "Ingest jobs for longhorizon.blue: Merlin ERDDAP to hourly series JSON"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Long Horizon Observatory" }]
dependencies = [
    "pandas>=2.2",
    "requests>=2.32",
    "google-cloud-storage>=2.18",
    # Surface fields (the `fields` job): satellite fetches and the NECOFS surface reader. A tag archive rather
    # than git+https, so the slim image installs it with pip and no git.
    "forcingkit @ https://github.com/lhzn-io/forcingkit/archive/refs/tags/v0.5.0.tar.gz",
]

[project.optional-dependencies]
# Only needed to read the notebook's HDF5 archive (one-time import, run locally).
archive = ["tables>=3.9"]

[project.scripts]
lhzn-blue-jobs = "lhzn_blue_jobs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # the forcingkit release archive above

[tool.hatch.build.targets.wheel]
packages = ["src/lhzn_blue_jobs"]
