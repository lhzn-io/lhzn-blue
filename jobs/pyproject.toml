[project]
name = "lhzn-blue-jobs"
version = "0.1.0"
description = "Ingest jobs for longhorizon.blue: Merlin ERDDAP to hourly series JSON"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Long Horizon Observatory" }]
dependencies = [
    "pandas>=2.2",
    "requests>=2.32",
    "google-cloud-storage>=2.18",
    # Surface fields (the `fields` job): satellite fetches and the NECOFS surface and full-depth readers; and HRDPS at
    # the stations (the `forecast` job).
    "forcingkit>=0.18.1,<0.19",
    "matplotlib>=3.8",  # point location on the model mesh (the shared coastline)
    "utide>=0.3",  # harmonic tide fits for the USGS tidal gauges (Codiga 2011)
    # The CO-OPS and ERDDAP clients and the guarded store (lhzn-io/insitukit; identified as this site in __init__.py).
    "insitukit>=0.5,<0.6",
]

[project.optional-dependencies]
# Only needed to read the notebook's HDF5 archive (one-time import, run locally).
archive = ["tables>=3.9"]

[project.scripts]
lhzn-blue-jobs = "lhzn_blue_jobs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lhzn_blue_jobs"]

[dependency-groups]
dev = [
    "pytest>=8",
]
