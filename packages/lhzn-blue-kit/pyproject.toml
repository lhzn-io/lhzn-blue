[project]
name = "lhzn-blue-kit"
version = "0.1.0"
description = "Shared pieces of the longhorizon.blue jobs: CO-OPS and ERDDAP clients, the JSON store, record statistics"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Long Horizon Observatory" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.32",
    "google-cloud-storage>=2.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lhzn_blue_kit"]

[dependency-groups]
dev = [
    "pytest>=8",
]
