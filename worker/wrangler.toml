# longhorizon.blue: static site plus /data/v1/* served from Workers KV.
# The Cloudflare account comes from CLOUDFLARE_ACCOUNT_ID (scripts/deploy-web.sh reads it from
# ~/.config/lhzn-blue/env).
name = "lhzn-blue"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "../apps/web/dist"
binding = "ASSETS"
run_worker_first = ["/data/*"]
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

# Per-address throttle on /data/*: 20 requests a minute per Cloudflare location. A page view uses 2.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Published JSON, written by the ingest jobs (jobs/), read here.
[[kv_namespaces]]
binding = "DATA"
id = "f999f7a6e90f4764a05362c7f6f612d0"
